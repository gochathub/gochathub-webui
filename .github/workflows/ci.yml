name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Contract snapshot drift
        run: |
          if [ -d ../gochatserver ]; then
            diff -q ../gochatserver/api/openapi.yaml api/openapi.yaml \
              || { echo "api/openapi.yaml is out of sync with the server contract. Refresh the snapshot in this PR."; exit 1; }
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test tests/markdown.test.ts

      - name: Smoke (integration, when env configured)
        env:
          GOCHATHUB_SMOKE: ${{ vars.GOCHATHUB_SMOKE }}
          GOCHATHUB_SMOKE_USER: ${{ vars.GOCHATHUB_SMOKE_USER }}
          GOCHATHUB_SMOKE_PASS: ${{ secrets.GOCHATHUB_SMOKE_PASS }}
        if: vars.GOCHATHUB_SMOKE != ''
        run: bun test tests/smoke/